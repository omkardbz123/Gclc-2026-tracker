<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GCLC 2026 Progress</title>
  <meta name="description" content="Daily participant progress for Google Cloud Learn With Communities 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <img class="logo" src="assets/logo.png" alt="GDG on Campus logo" onerror="this.hidden=true">
      <div class="brand">
        <h1 id="title">GCLC 2026 Progress Tracker</h1>
        <p id="subtitle"></p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" aria-label="Summary">
      <div class="stat"><div class="k">Participants</div><div class="v" id="s-count">–</div></div>
      <div class="stat"><div class="k" id="s-total-label">Total</div><div class="v" id="s-total">–</div></div>
      <div class="stat"><div class="k" id="s-active-label">Started</div><div class="v" id="s-active">–</div></div>
      <div class="stat"><div class="k">Last updated</div><div class="v small" id="s-updated">–</div></div>
    </section>

    <div class="notice" id="sample-note" hidden>Showing sample data. Real progress will appear after the first upload.</div>

    <div class="toolbar">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search your name…" autocomplete="off" aria-label="Search participants">
      </label>
      <span class="count" id="count"></span>
    </div>

    <div class="card">
      <div class="scroller">
        <table id="table" hidden>
          <thead><tr id="head"></tr></thead>
          <tbody id="body"></tbody>
        </table>
        <div class="status-msg" id="status">Loading progress…</div>
      </div>
    </div>
  </main>

  <footer class="wrap">Data is updated daily by the organizing team.</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/csv-core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
